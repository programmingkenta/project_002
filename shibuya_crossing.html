<!DOCTYPE html>
<html>
<head>
    <title>Isometric Shibuya Crossing</title>
    <style>
        body {
            margin: 0;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
        }
        h1 {
            margin: 15px 0 5px 0;
            font-size: 20px;
            letter-spacing: 2px;
        }
        canvas {
            border: 1px solid #333;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>ISOMETRIC SHIBUYA CROSSING</h1>
    <canvas id="city" width="900" height="700"></canvas>

    <script>
        const canvas = document.getElementById("city");
        const ctx = canvas.getContext("2d");

        // === ISOMETRIC SETTINGS ===
        const TILE_WIDTH = 64;
        const TILE_HEIGHT = 32;
        const ORIGIN_X = canvas.width / 2;
        const ORIGIN_Y = 200;

        // === THE KEY ISOMETRIC FORMULA ===
        // Same math as your Python turtle version!
        function gridToScreen(row, col) {
            const x = (col - row) * (TILE_WIDTH / 2) + ORIGIN_X;
            const y = (row + col) * (TILE_HEIGHT / 2) + ORIGIN_Y;
            return { x, y };
        }

        // === DRAW A FILLED POLYGON ===
        // Like pen.begin_fill() ... pen.end_fill() in turtle!
        function drawPolygon(points, fillColor, strokeColor) {
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
            ctx.fillStyle = fillColor;
            ctx.fill();
            if (strokeColor) {
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }
        }

        // === DRAW ONE ISOMETRIC BUILDING ===
        function drawBuilding(row, col, height, colors) {
            const { x, y } = gridToScreen(row, col);
            const hw = TILE_WIDTH / 2;
            const hh = TILE_HEIGHT / 2;

            // Ground diamond corners
            const top    = { x: x,      y: y - hh };
            const right  = { x: x + hw, y: y };
            const bottom = { x: x,      y: y + hh };
            const left   = { x: x - hw, y: y };

            // Raised corners (roof)
            const topUp    = { x: x,      y: y - hh - height };
            const rightUp  = { x: x + hw, y: y - height };
            const bottomUp = { x: x,      y: y + hh - height };
            const leftUp   = { x: x - hw, y: y - height };

            // Draw 3 visible faces (back to front)
            // LEFT face (medium shade)
            drawPolygon([left, leftUp, topUp, top], colors.left, "#00000033");
            // RIGHT face (darkest - shadow)
            drawPolygon([right, rightUp, topUp, top], colors.right, "#00000033");
            // TOP face (lightest - sun)
            drawPolygon([topUp, rightUp, bottomUp, leftUp], colors.top, "#00000033");
        }

        // === DRAW A GROUND TILE ===
        function drawGroundTile(row, col, color) {
            const { x, y } = gridToScreen(row, col);
            const hw = TILE_WIDTH / 2;
            const hh = TILE_HEIGHT / 2;

            drawPolygon([
                { x: x,      y: y - hh },
                { x: x + hw, y: y },
                { x: x,      y: y + hh },
                { x: x - hw, y: y }
            ], color, "#33333366");
        }

        // === SHIBUYA BUILDING DATA ===
        // Each building: { row, col, height, name, colors }
        // The grid represents the area around Shibuya Crossing
        //
        //  Row 0: North side (Shibuya Station side)
        //  Row 4-5: South side (Shibuya 109 side)
        //  Cols 3-5: The crossing itself (street)

        const GRAY_BUILDING = {
            left: "#8888AA", right: "#666688", top: "#AAAACC"
        };
        const DARK_BUILDING = {
            left: "#556677", right: "#334455", top: "#778899"
        };
        const WARM_BUILDING = {
            left: "#AA8866", right: "#886644", top: "#CCAA88"
        };
        const SHIBUYA_109 = {
            left: "#CC7744", right: "#AA5522", top: "#EEAA77"
        };
        const QFRONT = {
            left: "#5577CC", right: "#3355AA", top: "#88AAEE"
        };
        const STATION = {
            left: "#777777", right: "#555555", top: "#999999"
        };
        const GREEN_SPACE = {
            left: "#448844", right: "#336633", top: "#66AA66"
        };

        const buildings = [
            // --- North side (behind the crossing) ---
            { row: 0, col: 0, height: 70,  name: "Shibuya Station", colors: STATION },
            { row: 0, col: 1, height: 55,  name: "Station Wing",    colors: STATION },
            { row: 0, col: 2, height: 45,  name: "Station East",    colors: GRAY_BUILDING },
            { row: 0, col: 7, height: 60,  name: "Mark City",       colors: DARK_BUILDING },
            { row: 0, col: 8, height: 65,  name: "Mark City B",     colors: DARK_BUILDING },

            { row: 1, col: 0, height: 50,  name: "Hachiko Plaza",   colors: STATION },
            { row: 1, col: 1, height: 30,  name: "Bus Terminal",    colors: GRAY_BUILDING },
            { row: 1, col: 8, height: 45,  name: "Office A",        colors: WARM_BUILDING },

            // --- The Crossing (rows 2-3, cols 2-6 = streets!) ---
            { row: 2, col: 0, height: 85,  name: "Tsutaya",         colors: WARM_BUILDING },
            { row: 2, col: 1, height: 95,  name: "Q-Front",         colors: QFRONT },
            { row: 2, col: 7, height: 50,  name: "Miyashita",       colors: GRAY_BUILDING },
            { row: 2, col: 8, height: 40,  name: "Shop",            colors: WARM_BUILDING },

            { row: 3, col: 0, height: 60,  name: "Center-Gai",      colors: WARM_BUILDING },
            { row: 3, col: 1, height: 75,  name: "Tower Records",   colors: GRAY_BUILDING },
            { row: 3, col: 7, height: 55,  name: "Office B",        colors: DARK_BUILDING },
            { row: 3, col: 8, height: 35,  name: "Konbini",         colors: GRAY_BUILDING },

            // --- South side ---
            { row: 4, col: 0, height: 40,  name: "Shop C",          colors: GRAY_BUILDING },
            { row: 4, col: 1, height: 50,  name: "Restaurant Row",  colors: WARM_BUILDING },
            { row: 4, col: 2, height: 30,  name: "Cafe",            colors: WARM_BUILDING },
            { row: 4, col: 6, height: 35,  name: "Park Edge",       colors: GREEN_SPACE },
            { row: 4, col: 7, height: 80,  name: "Hikarie",         colors: QFRONT },
            { row: 4, col: 8, height: 70,  name: "Hikarie B",       colors: QFRONT },

            // TODO(human): Add Shibuya 109! It's the iconic cylindrical
            // building at the south-west corner of the crossing.
            // Add a new building entry here with:
            //   row: 5, col: 1, height: ??, name: "Shibuya 109", colors: SHIBUYA_109
            // Pick a height that feels right (real building is ~50m)


            { row: 5, col: 0, height: 45,  name: "Dogenzaka",       colors: DARK_BUILDING },
            { row: 5, col: 2, height: 35,  name: "Shop D",          colors: GRAY_BUILDING },
            { row: 5, col: 7, height: 60,  name: "Cerulean",        colors: DARK_BUILDING },
            { row: 5, col: 8, height: 55,  name: "Office C",        colors: GRAY_BUILDING },
        ];

        // === RENDER THE CITY ===
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw ground tiles
            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    // Streets around the crossing (rows 2-3, cols 2-6)
                    const isCrossing = (row >= 2 && row <= 3 && col >= 2 && col <= 6);
                    const isStreetH = (row >= 2 && row <= 3) && (col >= 2 && col <= 6);
                    const isStreetV = (col >= 3 && col <= 5);

                    if (isCrossing) {
                        drawGroundTile(row, col, "#555560");  // Road
                    } else if (isStreetV && (row < 2 || row > 3)) {
                        drawGroundTile(row, col, "#555560");  // Road continues
                    } else {
                        drawGroundTile(row, col, "#3a3a4a");  // Sidewalk
                    }
                }
            }

            // Draw crossing stripes (zebra crossing)
            for (let col = 2; col <= 6; col++) {
                for (let row = 2; row <= 3; row++) {
                    const { x, y } = gridToScreen(row, col);
                    ctx.fillStyle = "#ffffff22";
                    ctx.fillRect(x - 4, y - 2, 8, 4);
                }
            }

            // Sort buildings: draw back to front (painter's algorithm)
            const sorted = [...buildings].sort((a, b) =>
                (a.row + a.col) - (b.row + b.col)
            );

            // Draw all buildings
            for (const b of sorted) {
                drawBuilding(b.row, b.col, b.height, b.colors);
            }

            // Draw title label for key landmarks
            ctx.font = "10px Arial";
            ctx.fillStyle = "#ffffff88";
            ctx.textAlign = "center";
            for (const b of sorted) {
                if (["Shibuya 109", "Q-Front", "Shibuya Station", "Hikarie"].includes(b.name)) {
                    const { x, y } = gridToScreen(b.row, b.col);
                    ctx.fillText(b.name, x, y - b.height - 8);
                }
            }
        }

        render();
    </script>
</body>
</html>
